spring.application.name=car-auction
spring.datasource.url=jdbc:postgresql://localhost:5432/car_marketplace
spring.datasource.username=admin
spring.datasource.password=admin

# Tworzy i aktualizuje tabele automatycznie na podstawie encji
spring.jpa.hibernate.ddl-auto=create-drop

# Ładne formatowanie SQL w konsoli (przyda się przy szukaniu problemu N+1)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true